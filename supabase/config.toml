# Minimal config — only sections consumed by remote CLI commands
# (link, db push, functions deploy) and CLI project identity.
# Settings for local dev (api, auth, storage, realtime, studio, etc.)
# are intentionally omitted; `supabase start` uses defaults if ever needed.

project_id = "CoasterRank"

[db]
# Must match remote Postgres major version; used by db diff shadow DB.
major_version = 17

# Edge Function deploy settings, consumed by `supabase functions deploy` (CI on merge to main).
# recompute-rankings does its own 3-way Bearer auth (cron secret / service-role key / admin JWT),
# so the platform-level JWT check must stay off — otherwise pg_cron calls are rejected with 401
# before the function code runs.
[functions.recompute-rankings]
verify_jwt = false

# manage-test-data does its own admin JWT / service-role check (same pattern as
# assume-identity) so platform JWT verification must stay off — the function
# validates the caller's admin status itself and gates all operations to synthetic
# users only. See supabase/functions/manage-test-data/index.ts.
[functions.manage-test-data]
verify_jwt = false

# assume-identity also does custom admin + synthetic-target checks; keep platform
# verification off so service-role callers can reach it and the function can
# return 403 (admin required) instead of a generic 401 from the gateway.
[functions.assume-identity]
verify_jwt = false
