name = "coasterrank"
compatibility_date = "2026-08-28"
main = "src/worker.ts"
# run_worker_first must list "/" so social-crawler requests to the base URL
# reach the worker's OG-prerender branch (crawlers don't run JS; the bare SPA
# shell unfurls without a preview image). Humans on "/" also invoke the
# worker but fall through to the same static assets — one extra hop, no
# behavior change. "/riders/*" and "/@*" cover the rider share pages (the /@
# vanity alias prerenders with og:url canonicalized to /riders/*). "/%40*" is
# the belt-and-suspenders twin: if Cloudflare matches globs against the raw
# encoded path, a crawler on a chat-app-encoded /%40username share URL would
# otherwise bypass the worker and unfurl the bare SPA shell. "/sitemap.xml"
# routes crawlers (and humans) to the worker's sitemap handler — without it
# the SPA fallback would answer with index.html. All other
# static paths still serve directly from the edge.
assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/", "/api/*", "/riders/*", "/@*", "/%40*", "/sitemap.xml"] }

# NOTE: resvg-wasm ships as a precompiled module via wrangler's DEFAULT
# CompiledWasm rule (**/*.wasm — do NOT add a custom [[rules]] entry; it
# shadows the default and breaks the build). workerd disallows runtime
# WebAssembly.compile ("Wasm code generation disallowed by embedder"), so
# og-image.ts passes the imported WebAssembly.Module to initWasm() instead
# of fetched bytes. (Node/vitest can't import .wasm — loadCompiledWasm()
# falls back to bytes there.)

# Workers Logs: ships console.* from the worker to the Cloudflare dashboard
# (Workers → coasterrank → Logs) — this is how /api/ranking cache fills are
# observed; Cache API operations do NOT appear in standard CDN cache analytics.
[observability]
enabled = true
