name = "coasterrank"
compatibility_date = "2026-08-28"
main = "src/worker.ts"
assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/api/*", "/riders/*"] }
# Analytics EVENTS dispatch (Telegram): when set, the Worker pings the EVENTS channel.
# All three are optional — sends no-op without them, so forks/staging never spam prod.
#   COASTER_RANK_EVENTS_BOT_TOKEN, TELEGRAM_USER_ID, SUPABASE_SERVICE_ROLE_KEY, APP_ENV
# Dashboard → Workers → coasterrank → Settings → Variables (APP_ENV plain, others Encrypted).

# Workers Logs: ships console.* from the worker to the Cloudflare dashboard
# (Workers → coasterrank → Logs) — this is how /api/ranking cache fills are
# observed; Cache API operations do NOT appear in standard CDN cache analytics.
[observability]
enabled = true
