<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rank the coasters you've ridden and get your own shareable ranking page. Live community board computed with a Bradley-Terry model."
    />
    <meta property="og:site_name" content="CoasterRank" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Racing+Sans+One&display=swap"
      rel="stylesheet"
    />
    <title>CoasterRank</title>
    <!-- UI-mode pre-paint: apply `.dark` + the dark tab icon before first
         paint so themed visitors never flash the light canvas. Mirrors
         resolveIsDark()/syncFavicon() in src/lib/settings.ts
         (cr.settings.v1 {theme}); main.tsx re-applies + subscribes on boot.
         No external deps, storage failures → light. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('cr.settings.v1') || '{}')
        var t = s.theme || 'system'
        var d =
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) {
          document.documentElement.classList.add('dark')
          var l = document.querySelector('link[rel="icon"]')
          if (l) l.setAttribute('href', '/favicon-dark.svg')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
