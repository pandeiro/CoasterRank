name: deploy-netlify

on:
  schedule:
    - cron: '0 19 * * *' # 3 PM ET = 7 PM UTC
  workflow_dispatch: # manual "Deploy now" button

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-netlify/check-and-push
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for SPA changes since last deploy
        id: check
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)

          LAST_DEPLOY_SHA=$(curl -sf -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys?per_page=1&state=ready" \
            | jq -r '.[0].commit_sha')

          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "last_deploy_sha=$LAST_DEPLOY_SHA" >> "$GITHUB_OUTPUT"

          # First deploy — no previous deploy to compare against
          if [ "$LAST_DEPLOY_SHA" = "null" ] || [ -z "$LAST_DEPLOY_SHA" ]; then
            echo "### First deploy — no previous Netlify deploy found" >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same SHA — nothing has changed at all
          if [ "$CURRENT_SHA" = "$LAST_DEPLOY_SHA" ]; then
            echo "### No changes to deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "HEAD ($CURRENT_SHA) matches the last Netlify deploy — skipping."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SHA differs — check if any SPA-relevant files changed (app/ only)
          SPA_CHANGED=$(git diff --name-only "$LAST_DEPLOY_SHA" "$CURRENT_SHA" -- app/)
          if [ -z "$SPA_CHANGED" ]; then
            echo "### No SPA changes to deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "Commits exist since last deploy but none touch app/ — skipping."
            echo "Changed files:" >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only "$LAST_DEPLOY_SHA" "$CURRENT_SHA" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "### Deploying" >> "$GITHUB_STEP_SUMMARY"
            echo "SPA changes detected since last deploy ($LAST_DEPLOY_SHA → $CURRENT_SHA):" >> "$GITHUB_STEP_SUMMARY"
            echo "$SPA_CHANGED" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_deploy == 'true'
        run: npm ci
        working-directory: app

      - name: Build
        if: steps.check.outputs.should_deploy == 'true'
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy to Netlify
        if: steps.check.outputs.should_deploy == 'true'
        run: npx netlify-cli deploy --prod --dir=app/dist
