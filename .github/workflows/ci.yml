name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ci/check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:run

      - run: npm run format:check

  check-bt:
    name: ci/check-bt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bt

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/bt/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run format:check

  check-scripts:
    name: ci/check-scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run format:check

  # supabase db push refuses out-of-order migrations at deploy time (see
  # #159/#161): a migration stamped before one that already merged+applied
  # fails the post-merge deploy. Catch it while the PR is still open instead.
  migration-order:
    name: ci/migration-order
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail if a new migration is not newer than the base branch's newest
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # Shallow tip of the base branch is all we need to list its tree.
          git fetch --depth=1 origin "${{ github.base_ref }}"

          base_max=$(
            git ls-tree -r --name-only "$base" -- supabase/migrations \
              | grep -E '/[0-9]{14}_[^/]*\.sql$' \
              | sed -E 's|.*/([0-9]{14})_.*|\1|' \
              | sort -n | tail -1 || true
          )
          if [ -z "$base_max" ]; then
            echo "No migrations on ${{ github.base_ref }} yet — nothing to order against."
            exit 0
          fi
          echo "Newest migration on ${{ github.base_ref }}: $base_max"

          fail=0
          while IFS= read -r f; do
            # Files already on the base are counted in base_max — only new
            # files can be out of order.
            if git cat-file -e "$base:$f" 2>/dev/null; then
              continue
            fi
            v=$(basename "$f" | cut -c1-14)
            if [ "$v" -le "$base_max" ]; then
              echo "::error file=$f::Migration version $v is not newer than ${{ github.base_ref }}'s newest ($base_max). db push will reject it as out-of-order after merge. Re-stamp the file (git mv $f <newer-timestamp>_<same-name>.sql, content unchanged) — see PR #161."
              fail=1
            fi
          done < <(
            git ls-tree -r --name-only HEAD -- supabase/migrations \
              | grep -E '/[0-9]{14}_[^/]*\.sql$' || true
          )

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Migration ordering OK: all new migrations are newer than $base_max."

  # As of 2026-10-30 Supabase no longer auto-grants Data API access to new
  # tables in "public" (platform notice 2026-10-20). A table created without
  # GRANTs is invisible to supabase-js/PostgREST, and the failure surfaces days
  # after merge as runtime "permission denied". Convention: grant to the API
  # roles served, in the same migration that creates the table (AGENTS.md;
  # details in .agents/skills/supabase). This preflight checks PR-new migrations.
  migration-grants:
    name: ci/migration-grants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail if a new migration creates a public table without grants
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch --depth=1 origin "${{ github.base_ref }}"

          fail=0
          while IFS= read -r f; do
            # Only files that are new in this PR (same rule as migration-order).
            if git cat-file -e "$base:$f" 2>/dev/null; then
              continue
            fi
            if ! grep -qiE 'create[[:space:]]+table[[:space:]]+(if[[:space:]]+not[[:space:]]+exists[[:space:]]+)?("?)public("?)\.' "$f"; then
              continue
            fi
            # Escape hatch for grants intentionally living in a paired migration.
            if grep -q -- '-nogrant-ok' "$f"; then
              continue
            fi
            if ! grep -qiE '^[[:space:]]*grant[[:space:]]' "$f"; then
              echo "::error file=$f::Migration creates a table in public but grants no privileges. Since 2026-10-30 Supabase does not auto-grant Data API access to new public tables — grant to the API roles this table serves (and service_role it needs) in the same migration (see AGENTS.md and .agents/skills/supabase). If grants intentionally live elsewhere, add '-nogrant-ok' to this file."
              fail=1
            fi
          done < <(
            git ls-tree -r --name-only HEAD -- supabase/migrations \
              | grep -E '/[0-9]{14}_[^/]*\.sql$' || true
          )

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Migration grants OK: every new public-table migration grants in-file."

  check-match:
    name: ci/check-match
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/match

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/match/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run format:check
