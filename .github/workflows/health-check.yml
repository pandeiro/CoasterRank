name: health-check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Override prod URL (default https://coasterrank.app)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: health-check/smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HEALTH_CHECK_URL: ${{ inputs.url || 'https://coasterrank.app' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ALERTS_BOT_TOKEN: ${{ secrets.COASTER_RANK_ALERTS_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install scripts deps
        run: npm ci
        working-directory: scripts

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Run health check
        id: check
        run: npx tsx src/health-check.ts --url "$HEALTH_CHECK_URL"
        working-directory: scripts

      - name: Upload failure screenshot
        if: failure() && hashFiles('/tmp/health-check-failure.png') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-check-failure
          path: /tmp/health-check-failure.png
          if-no-files-found: ignore
          retention-days: 7

      # Telegram template (rendered on failure) — keep in sync with scripts/src/health-check.ts header:
      #   🚨 Health check FAILED
      #   🩺 Target: https://coasterrank.app
      #   ⏰ Time: 2026-09-04T22:52:00Z
      #   🔗 Run: https://github.com/pandeiro/CoasterRank/actions/runs/123456789
      #   Drill: check cron_execution_logs + /api/ranking (see run log).
      # Full per-check detail lives in the job log + $GITHUB_STEP_SUMMARY.
      - name: Notify failure (CoasterRankAlerts)
        if: failure() && env.ALERTS_BOT_TOKEN != '' && env.TELEGRAM_USER_ID != ''
        run: |
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          MSG="🚨 Health check FAILED"
          MSG="${MSG}"$'\n'"🩺 Target: ${HEALTH_CHECK_URL}"
          MSG="${MSG}"$'\n'"⏰ Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MSG="${MSG}"$'\n'"🔗 Run: ${RUN_URL}"
          MSG="${MSG}"$'\n'"Drill: check cron_execution_logs + /api/ranking (see run log)."

          curl -sf -X POST "https://api.telegram.org/bot${ALERTS_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="${MSG}" \
            -d parse_mode="Markdown" || true
