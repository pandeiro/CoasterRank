name: deploy-supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      # The Edge Function bundles packages/bt/src/mm.ts at deploy time, so
      # algorithm/knob changes must redeploy the function too.
      - "packages/bt/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-supabase-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=(SUPABASE_ACCESS_TOKEN)
          [ -n "$PROJECT_REF" ] || missing+=(PROJECT_REF)
          [ -n "$SUPABASE_DB_URL" ] || missing+=(SUPABASE_DB_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::deploy-supabase is missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      # The supabase npm package postinstall refuses global npm installs, so
      # download the Linux binary directly from the GitHub release instead.
      - name: Install Supabase CLI
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin supabase
          supabase --version

      - name: Ensure PostgreSQL client is available
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Link project
        id: link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.PROJECT_REF }}"

      - name: Preflight migration data
        run: |
          set -euo pipefail

          invalid_usernames=$(psql "$SUPABASE_DB_URL" -Atc "
            select count(*)
            from public.profiles
            where username is not null
              and username !~ '^[a-z0-9_]{3,20}$';
          ")
          duplicate_usernames=$(psql "$SUPABASE_DB_URL" -Atc "
            select count(*)
            from (
              select lower(username)
              from public.profiles
              where username is not null
              group by lower(username)
              having count(*) > 1
            ) duplicates;
          ")
          invalid_submission_rows=$(psql "$SUPABASE_DB_URL" -Atc "
            select count(*)
            from public.coaster_submissions
            where coalesce(jsonb_typeof(suggested_fields) <> 'object', true)
               or exists (
                 select 1
                 from jsonb_object_keys(suggested_fields) as key
                 where key not in ('height_m', 'speed_kmh', 'length_m', 'inversions', 'material')
               );
          ")

          if [ "$invalid_usernames" -ne 0 ] || [ "$duplicate_usernames" -ne 0 ] || [ "$invalid_submission_rows" -ne 0 ]; then
            echo "::error::migration preflight failed: invalid usernames=$invalid_usernames, case-insensitive duplicate usernames=$duplicate_usernames, invalid submission payload rows=$invalid_submission_rows"
            echo "Resolve these existing rows before applying 20260906120000_security_hardening.sql. No migration was attempted."
            exit 1
          fi
          echo "Migration preflight passed: username and submission payload data are compatible."

      - name: Apply migrations
        id: apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Verify deployed schema contract
        run: |
          set -euo pipefail
          # information_schema.parameters has no routine_name column; join
          # routines on specific_name (overloads get suffixed like
          # public_board_meta_18395) and check per-signature, so overloads
          # don't garble the aggregated signature.
          matches=$(psql "$SUPABASE_DB_URL" -Atc "
            select count(*) from (
              select string_agg(p.parameter_name, ',' order by p.ordinal_position) as sig
              from information_schema.parameters p
              join information_schema.routines r
                on r.specific_name = p.specific_name and r.specific_schema = p.specific_schema
              where r.routine_schema = 'public'
                and r.routine_name = 'public_board_meta'
                and p.parameter_mode = 'OUT'
              group by r.specific_name
            ) s where s.sig = 'real_user_count,ranked_user_count,last_recomputed_at';
          ")
          expected='1'
          if [ "$matches" != "$expected" ]; then
            signatures=$(psql "$SUPABASE_DB_URL" -Atc "
              select string_agg(p.parameter_name, ',' order by p.ordinal_position)
              from information_schema.parameters p
              join information_schema.routines r
                on r.specific_name = p.specific_name and r.specific_schema = p.specific_schema
              where r.routine_schema = 'public'
                and r.routine_name = 'public_board_meta'
                and p.parameter_mode = 'OUT'
              group by r.specific_name;")
            echo "::error::deployed public_board_meta OUT-param signatures: '$signatures', expected 'real_user_count,ranked_user_count,last_recomputed_at'"
            exit 1
          fi
          echo "Verified public_board_meta OUT-param signature: $matches"

      - name: Deploy edge functions
        id: deploy_fn
        # Deploy every function directory with an entrypoint so new functions
        # do not require a workflow edit.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -e
          shopt -s nullglob  # supabase/functions/*/ expands to nothing if absent
          dirs=(supabase/functions/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No function directories under supabase/functions/ — nothing to deploy."
            exit 0
          fi
          for d in "${dirs[@]}"; do
            name=$(basename "$d")
            if [ -f "$d/index.ts" ] || [ -f "$d/index.js" ]; then
              echo "::group::Deploying function: $name"
              supabase functions deploy "$name"
              echo "::endgroup::"
            else
              echo "Skipping $name — no index.ts/index.js entrypoint found."
            fi
          done

      # ── Schema-doc regeneration ──────────────────────────────────────
      - name: Checkout (clean tree for schema-doc)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Generate schema docs
        run: npm ci && npm run schema-doc
        working-directory: scripts

      - name: Open schema docs update PR if changed
        # Non-blocking: creating the PR requires the repo setting
        # "Allow GitHub Actions to create and approve pull requests", which
        # is not API-manageable. If it's off, docs/SCHEMA.md still lands on
        # bot/schema-docs (push above) and a human can open the PR manually.
        # The deploy itself must never go red over the docs step.
        continue-on-error: true
        id: schema_pr
        run: |
          set -euo pipefail
          git diff --quiet docs/SCHEMA.md && echo "No changes" && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/schema-docs
          git add docs/SCHEMA.md
          git commit -m "docs: regenerate SCHEMA.md [skip ci]"
          git push --force origin HEAD:bot/schema-docs
          if [ "$(gh pr list --state open --head bot/schema-docs --json number --jq 'length')" = "0" ]; then
            cat > /tmp/schema-doc-pr.md <<'EOF'
          This automated PR updates `docs/SCHEMA.md` from the production schema after the Supabase deployment completed.

          The deploy workflow keeps this change on a reviewable branch so protected `main` can require pull requests.
          EOF
            gh pr create \
              --base main \
              --head bot/schema-docs \
              --title "docs: regenerate SCHEMA.md" \
              --body-file /tmp/schema-doc-pr.md
          else
            echo "An open schema-doc PR already exists; branch was refreshed."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The ::error:: workflow commands surface useful annotations in the run
      # summary, not just buried in the log.
      - name: Report failure cause
        if: ${{ failure() }}
        run: |
          echo "::error::deploy-supabase failed. Most likely cause by step:"
          if [ "${{ steps.link.outcome }}" = "failure" ]; then
            echo "::error::'Link project' failed — almost always an EXPIRED or REVOKED SUPABASE_ACCESS_TOKEN (these are rotated periodically), or a wrong PROJECT_REF. Fix: regenerate the token at the Supabase dashboard (Account → Access Tokens), update the SUPABASE_ACCESS_TOKEN repo secret, then re-run this workflow from the Actions tab."
          fi
          if [ "${{ steps.apply.outcome }}" = "failure" ]; then
            echo "::error::'Apply migrations' failed — usually a SQL error in a migration (see the 'Apply migrations' log for the offending statement). If the log mentions auth/401, treat it as an expired SUPABASE_ACCESS_TOKEN and rotate it."
          fi
          if [ "${{ steps.deploy_fn.outcome }}" = "failure" ]; then
            echo "::error::'Deploy edge functions' failed — usually a TypeScript bundle/import error in one of the function directories under supabase/functions/ (the failed function is named in the log above). If the log mentions auth/401, treat it as an expired SUPABASE_ACCESS_TOKEN and rotate it."
          fi
