name: deploy-supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Failure model:
    #   - The `secrets` context is NOT allowed in `if` expressions — only
    #     github/needs/inputs/env/vars. So we surface the secrets as job-level
    #     env vars (empty string when undefined) and gate every deploy step on
    #     `env.<NAME> != ''`. When the repo secrets aren't set, every step
    #     skips — a silent no-op (no step actually fails).
    #   - When a step DOES run and fails, `supabase link` is the first auth-
    #     requiring step, so its failure is almost always an EXPIRED or REVOKED
    #     SUPABASE_ACCESS_TOKEN (we rotate these periodically), or a wrong
    #     PROJECT_REF. The "Report failure cause" step below turns that into a
    #     red annotation on the run summary so it's impossible to miss.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != '' }}
        run: npm install -g supabase

      - name: Link project
        id: link
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.PROJECT_REF }}"

      - name: Apply migrations
        id: apply
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push

      - name: Deploy edge functions
        id: deploy_fn
        # Deploys EVERY function directory under supabase/functions/ that has an
        # entrypoint (index.ts or index.js). This auto-picks up new functions
        # without workflow edits, and skips gracefully when supabase/functions/
        # is empty or doesn't exist yet (e.g. before Phase 6) — the loop just
        # finds nothing and exits 0, so the step stays green (not red).
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -e
          shopt -s nullglob  # supabase/functions/*/ expands to nothing if absent
          dirs=(supabase/functions/*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No function directories under supabase/functions/ — nothing to deploy."
            exit 0
          fi
          for d in "${dirs[@]}"; do
            name=$(basename "$d")
            if [ -f "$d/index.ts" ] || [ -f "$d/index.js" ]; then
              echo "::group::Deploying function: $name"
              supabase functions deploy "$name"
              echo "::endgroup::"
            else
              echo "Skipping $name — no index.ts/index.js entrypoint found."
            fi
          done

      # Runs only if any step above actually failed (not skipped). Skipped steps
      # don't trigger failure(), so the no-op-when-secrets-missing behavior is
      # preserved. The ::error:: workflow commands surface as red annotations
      # on the run summary, not just buried in the log.
      - name: Report failure cause
        if: ${{ failure() }}
        run: |
          echo "::error::deploy-supabase failed. Most likely cause by step:"
          if [ "${{ steps.link.outcome }}" = "failure" ]; then
            echo "::error::'Link project' failed — almost always an EXPIRED or REVOKED SUPABASE_ACCESS_TOKEN (these are rotated periodically), or a wrong PROJECT_REF. Fix: regenerate the token at the Supabase dashboard (Account → Access Tokens), update the SUPABASE_ACCESS_TOKEN repo secret, then re-run this workflow from the Actions tab."
          fi
          if [ "${{ steps.apply.outcome }}" = "failure" ]; then
            echo "::error::'Apply migrations' failed — usually a SQL error in a migration (see the 'Apply migrations' log for the offending statement). If the log mentions auth/401, treat it as an expired SUPABASE_ACCESS_TOKEN and rotate it."
          fi
          if [ "${{ steps.deploy_fn.outcome }}" = "failure" ]; then
            echo "::error::'Deploy edge functions' failed — usually a TypeScript bundle/import error in one of the function directories under supabase/functions/ (the failed function is named in the log above). If the log mentions auth/401, treat it as an expired SUPABASE_ACCESS_TOKEN and rotate it."
          fi