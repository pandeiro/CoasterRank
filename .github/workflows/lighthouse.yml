name: lighthouse

# Advisory Lighthouse tracking — NEVER a required check, NEVER blocking.
# All assertions in lighthouserc.js are `warn`, so this job stays green and
# exists to produce an easily-referenced summary + full reports.
#
# Why schedule-only (no PR trigger): a PR run against prod would measure
# prod, not the PR's code, and a static `vite preview` has no Supabase data
# behind it — both would be theater. Authed routes are excluded for the same
# reason (no seeded session in CI); authed surfaces get axe/component
# coverage + occasional manual runs instead.
on:
  schedule:
    # Weekly, Monday 09:00 UTC — frequent enough to catch drift, light
    # enough to not spam temporary-public-storage.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: 'Override target URL (default https://coasterrank.app)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    name: lighthouse/advisory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LHCI_URL: ${{ inputs.url || 'https://coasterrank.app' }}
      LHCI_RIDER: pandeiro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Lighthouse CI (warn-only, never fails)
        run: npx -y @lhci/cli@0.14 autorun
        # Warn-only assertions exit 0; belt-and-braces so a future `error`
        # promotion can't silently become a blocking gate without explicitly
        # adding this job to branch protection.
        continue-on-error: true

      - name: Write summary table
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          // LHCI only writes manifest.json for staticDistDir collects; for
          // remote URL collects the per-run .lighthouseci/lhr-*.json files are
          // the ground truth (every collect produces at least one).
          const lhrs = fs.readdirSync('.lighthouseci').filter((f) => /^lhr-.*\.json$/.test(f)).sort();
          if (!lhrs.length) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Lighthouse (advisory)\n\nNo LHR results — collect failed; see the infra-failure step below.\n');
            process.exit(0);
          }
          const byUrl = new Map();
          for (const file of lhrs) {
            const lhr = JSON.parse(fs.readFileSync('.lighthouseci/' + file, 'utf8'));
            const url = lhr.finalDisplayedUrl || '';
            const fmt = (v) => (v == null ? 'n/a' : Math.round(v * 100));
            byUrl.set(url, '| ' + url.replace(/^https?:\\/\\//,'').replace(/\\/$/, '') + ' | ' +
              fmt(lhr.categories && lhr.categories.performance && lhr.categories.performance.score) + ' | ' +
              fmt(lhr.categories && lhr.categories.accessibility && lhr.categories.accessibility.score) + ' | ' +
              fmt(lhr.categories && lhr.categories['best-practices'] && lhr.categories['best-practices'].score) + ' | ' +
              fmt(lhr.categories && lhr.categories.seo && lhr.categories.seo.score) + ' |');
          }
          const md = [
            '## Lighthouse (advisory, ' + process.env.LHCI_URL + ')',
            '',
            'Warn-only — informational, never blocking. Full reports in the `lighthouse-reports` artifact and temporary-public-storage links in the log.',
            '',
            '| page | perf | a11y | best | seo |',
            '| --- | --- | --- | --- | --- |',
            ...byUrl.values(),
            '',
            'Ratchet rule (lighthouserc.js): an audit holding green ~2 weeks gets promoted to `error` — and only then is this job considered for required checks.',
          ].join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          "

      - name: Fail on missing LHR results (infra rot, not scores)
        # Scores can never fail this job (warn-only + continue-on-error above),
        # but a total collect failure must not stay silent-green: no LHR
        # results means no measurement at all. This job is NOT in branch
        # protection, so red here is a signal, never a merge block.
        if: always()
        run: test -n "$(find .lighthouseci -name 'lhr-*.json' -print -quit)" || (echo "::error::LHCI produced no lhr-*.json results — collect failed, no pages measured" && exit 1)

      - name: Upload LHCI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 30
