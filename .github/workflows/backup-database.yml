name: backup-database

on:
  schedule:
    - cron: '0 8 * * *' # 4 AM ET = 8 AM UTC
  workflow_dispatch: # manual "Run backup" button

permissions:
  contents: read

env:
  RETENTION_DAYS: 7

jobs:
  backup:
    name: backup-database/pg-dump-and-rotate
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PAT: ${{ secrets.BACKUP_PAT }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
      EVENTS_BOT_TOKEN: ${{ secrets.COASTER_RANK_EVENTS_BOT_TOKEN }}
      ALERTS_BOT_TOKEN: ${{ secrets.COASTER_RANK_ALERTS_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
    steps:
      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "$BACKUP_PAT" ]; then
            echo "::error::BACKUP_PAT secret is not set. Generate a PAT with 'repo' scope at https://github.com/settings/tokens and add it as a repo secret."
            exit 1
          fi
          if [ -z "$BACKUP_REPO" ]; then
            echo "::error::BACKUP_REPO secret is not set. Set it to the target repo in 'owner/repo' format."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          set -e
          # Server is Postgres 17.6 (supabase/config.toml), runner default pg_dump is 16 → mismatch
          if /usr/lib/postgresql/17/bin/pg_dump --version 2>/dev/null | grep -q "17\."; then
            echo "pg_dump 17 already available: $(/usr/lib/postgresql/17/bin/pg_dump --version)"
            sudo update-alternatives --set pg_dump /usr/lib/postgresql/17/bin/pg_dump || sudo ln -sf /usr/lib/postgresql/17/bin/pg_dump /usr/bin/pg_dump
            pg_dump --version
            exit 0
          fi
          # GH ubuntu-latest (noble) lacks pg17; install from PGDG with modern signed-by (BackupDrill pattern)
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          sudo update-alternatives --set pg_dump /usr/lib/postgresql/17/bin/pg_dump || sudo ln -sf /usr/lib/postgresql/17/bin/pg_dump /usr/bin/pg_dump
          pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Create backup
        id: create-backup
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          FILENAME="coasterrank-${DATE}.sql.gz"

          echo "Dumping database to ${FILENAME}..."
          pg_dump "$SUPABASE_DB_URL" | gzip > "/tmp/${FILENAME}"

          SIZE=$(du -h "/tmp/${FILENAME}" | cut -f1)
          BYTES=$(stat -c%s "/tmp/${FILENAME}" 2>/dev/null || stat -f%z "/tmp/${FILENAME}")
          echo "### Backup created: ${FILENAME} (${SIZE}, ${BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"

          # Verify backup is not an empty gzip header (20 bytes) and contains SQL dump header
          if [ "$BYTES" -lt 1024 ]; then
            echo "::error::Backup file too small (${BYTES} bytes) — pg_dump likely failed (empty gzip header is 20 bytes)."
            exit 1
          fi
          # Use grep without head -c to avoid SIGPIPE+pipefail false failure (head exits 141 when grep -q closes pipe)
          if ! gunzip -c "/tmp/${FILENAME}" | grep -q "PostgreSQL database dump"; then
            echo "::error::Backup file does not contain PostgreSQL dump header — pg_dump probably errored."
            gunzip -c "/tmp/${FILENAME}" | head -n 30 || true
            exit 1
          fi

          echo "FILENAME=${FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Clone backup repo
        run: |
          git clone "https://x-access-token:${BACKUP_PAT}@github.com/${BACKUP_REPO}.git" /tmp/backup-repo

      - name: Copy backup and rotate old files
        id: copy-and-rotate
        run: |
          cd /tmp/backup-repo

          # Copy new backup in
          cp "/tmp/${{ steps.create-backup.outputs.FILENAME }}" .

          # Remove backups older than RETENTION_DAYS
          DELETED=$(find . -name 'coasterrank-*.sql.gz' -mtime +${RETENTION_DAYS} -print -delete)
          if [ -n "$DELETED" ]; then
            echo "### Rotated (deleted):" >> "$GITHUB_STEP_SUMMARY"
            echo "$DELETED" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

          # Stage changes
          git add -A

          # Check if there's anything to commit
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "nothing_changed=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "backup: ${{ steps.create-backup.outputs.FILENAME }}"
            echo "nothing_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to backup repo
        if: ${{ steps.copy-and-rotate.outputs.nothing_changed == 'false' }}
        run: |
          cd /tmp/backup-repo
          git push origin main

      - name: List current backups
        id: list-backups
        run: |
          cd /tmp/backup-repo
          echo "### Current backups in ${BACKUP_REPO}:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh coasterrank-*.sql.gz 2>/dev/null || echo "No backups found"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          BACKUP_COUNT=$(ls coasterrank-*.sql.gz 2>/dev/null | wc -l)
          echo "count=${BACKUP_COUNT}" >> "$GITHUB_OUTPUT"

      # ── Telegram notifications ──────────────────────────────────────
      - name: Notify success (CoasterRankEvents)
        if: ${{ success() && env.EVENTS_BOT_TOKEN != '' }}
        run: |
          SIZE=$(du -h "/tmp/${{ steps.create-backup.outputs.FILENAME }}" | cut -f1)
          BACKUP_COUNT=${{ steps.list-backups.outputs.count }}
          MSG="✅ Backup completed successfully"
          MSG="${MSG}"$'\n'"📦 File: ${{ steps.create-backup.outputs.FILENAME }}"
          MSG="${MSG}"$'\n'"📏 Size: ${SIZE}"
          MSG="${MSG}"$'\n'"🗄️ Backups stored: ${BACKUP_COUNT}"
          MSG="${MSG}"$'\n'"⏰ Retention: ${RETENTION_DAYS} days"

          curl -sf -X POST "https://api.telegram.org/bot${EVENTS_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="${MSG}" \
            -d parse_mode="Markdown"

      - name: Notify failure (CoasterRankAlerts)
        if: ${{ failure() && env.ALERTS_BOT_TOKEN != '' }}
        run: |
          REPO="${{ github.repository }}"
          RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}"
          MSG="🚨 Backup FAILED"
          MSG="${MSG}"$'\n'"🗄️ Repo: ${REPO}"
          MSG="${MSG}"$'\n'"⏰ Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MSG="${MSG}"$'\n'"🔗 Run: ${RUN_URL}"

          # Add specific failure details
          if [ -z "$SUPABASE_DB_URL" ]; then
            MSG="${MSG}"$'\n'"❌ Cause: SUPABASE_DB_URL secret is not set."
          elif [ -z "$BACKUP_PAT" ]; then
            MSG="${MSG}"$'\n'"❌ Cause: BACKUP_PAT secret is not set."
          fi

          curl -sf -X POST "https://api.telegram.org/bot${ALERTS_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_USER_ID}" \
            -d text="${MSG}" \
            -d parse_mode="Markdown"
