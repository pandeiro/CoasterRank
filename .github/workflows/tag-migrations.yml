name: tag-migrations

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Check for new migrations
        id: check_migrations
        run: |
          set -euo pipefail
          # Check if any files were added or modified in supabase/migrations/
          # compared to the base branch.
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD -- 'supabase/migrations/*.sql')"
          if [[ -n "$changed_files" ]]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add migrations tag
        if: steps.check_migrations.outputs.has_migrations == 'true'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label "migrations"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
